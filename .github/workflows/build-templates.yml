name: Build export templates

on:
  push:
    branches: [main]
    paths:
      - godot
      - profiles/**
      - modules/**
      - patches/**
      - config/**
      - .github/workflows/build-templates.yml
  workflow_dispatch:
    inputs:
      debug:
        description: Also build debug templates
        type: boolean
        default: false

concurrency:
  group: build-templates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.config.outputs.targets }}
      common_args: ${{ steps.config.outputs.common_args }}
      godot_tag: ${{ steps.engine.outputs.tag }}
      godot_commit: ${{ steps.engine.outputs.commit }}
      version_string: ${{ steps.engine.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve pinned engine version
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git ls-tree HEAD godot | awk '{print $3}')
          if [ -z "$commit" ]; then
            echo "::error::The godot/ submodule is missing from this commit."
            exit 1
          fi
          tag=""
          while read -r sha ref; do
            ref=${ref#refs/tags/}
            ref=${ref%'^{}'}
            if [ "$sha" = "$commit" ] && [ -z "$tag" ]; then
              tag=$ref
            fi
          done < <(git ls-remote --tags https://github.com/godotengine/godot.git)
          if [ -z "$tag" ]; then
            echo "::error::godot/ is at $commit, which is not an upstream tag."
            exit 1
          fi
          case "$tag" in
            *-stable) ;;
            *)
              echo "::error::godot/ is tagged $tag, not a *-stable tag."
              exit 1
              ;;
          esac
          version="${tag%-*}.${tag##*-}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read target matrix
        id: config
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.targets | type == "array" and length > 0' config/targets.json > /dev/null
          echo "targets=$(jq -c '.targets' config/targets.json)" >> "$GITHUB_OUTPUT"
          echo "common_args=$(jq -r '.common_args // empty' config/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target.name }}
    needs: plan
    runs-on: ${{ matrix.target.runner }}
    container:
      image: ${{ matrix.target.container }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify SCons
        shell: bash
        run: python3 -m SCons --version

      - name: Restore SCons cache
        uses: actions/cache@v5
        with:
          path: .scons_cache
          key: scons-${{ runner.os }}-${{ matrix.target.name }}-${{ needs.plan.outputs.godot_commit }}-${{ hashFiles('config/**', 'profiles/**', 'modules/**', 'patches/**') }}
          restore-keys: |
            scons-${{ runner.os }}-${{ matrix.target.name }}-${{ needs.plan.outputs.godot_commit }}-
            scons-${{ runner.os }}-${{ matrix.target.name }}-

      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in patches/*.patch; do
            [ -e "$patch" ] || continue
            git -C godot apply "../$patch"
          done

      - name: Build and stage templates
        shell: bash
        env:
          TARGET_JSON: ${{ toJSON(matrix.target) }}
          TARGET_NAME: ${{ matrix.target.name }}
          COMMON_ARGS: ${{ needs.plan.outputs.common_args }}
          PLATFORM: ${{ matrix.target.platform }}
          ARCH: ${{ matrix.target.arch }}
          PROFILE: ${{ matrix.target.profile }}
          EXTRA_ARGS: ${{ matrix.target.args }}
          DEBUG: ${{ inputs.debug == true }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${COMMON_ARGS:-}" ]; then
            read -r -a common <<< "$COMMON_ARGS"
            args+=("${common[@]}")
          fi
          args+=("platform=$PLATFORM" "arch=$ARCH")
          args+=(
            "cache_path=${GITHUB_WORKSPACE}/.scons_cache"
            "redirect_build_objects=no"
          )
          if [ -n "${PROFILE:-}" ]; then
            args+=("build_profile=../profiles/$PROFILE")
          fi
          if find modules -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            args+=("custom_modules=../modules")
          fi
          if [ -n "${EXTRA_ARGS:-}" ]; then
            read -r -a extra <<< "$EXTRA_ARGS"
            args+=("${extra[@]}")
          fi
          if [ "$PLATFORM" = "linuxbsd" ]; then
            case "$ARCH" in
              x86_64) sdk=/root/x86_64-godot-linux-gnu_sdk-buildroot ;;
              arm64) sdk=/root/aarch64-godot-linux-gnu_sdk-buildroot ;;
              *)
                echo "::error::No Linux SDK for $ARCH."
                exit 1
                ;;
            esac
            export PATH="$sdk/bin:$PATH"
          fi

          (cd godot && python3 -m SCons "${args[@]}")

          mkdir -p dist

          while IFS=$'\t' read -r source name; do
            cp "godot/bin/$source" "dist/$name"
          done < <(jq -r '.outputs | to_entries[] | "\(.key)\t\(.value)"' <<< "$TARGET_JSON" | tr -d '\r')

          if [ "${DEBUG:-false}" = "true" ]; then
            debug_args=("${args[@]}")
            for i in "${!debug_args[@]}"; do
              if [ "${debug_args[$i]}" = "target=template_release" ]; then
                debug_args[$i]="target=template_debug"
              fi
            done
            (cd godot && python3 -m SCons "${debug_args[@]}")
            while IFS=$'\t' read -r source name; do
              debug_source=${source/template_release/template_debug}
              debug_name=${name/release/debug}
              cp "godot/bin/$debug_source" "dist/$debug_name"
            done < <(jq -r '.outputs | to_entries[] | "\(.key)\t\(.value)"' <<< "$TARGET_JSON" | tr -d '\r')
          fi

          files=$(cd dist && ls -1 | tr -d '\r' | jq -Rn '[inputs]')
          jq -n \
            --arg name "$TARGET_NAME" \
            --arg args "${args[*]}" \
            --argjson files "$files" \
            '{name: $name, args: $args, files: $files}' \
            > "dist/$TARGET_NAME.target.json"

      - name: Upload templates
        uses: actions/upload-artifact@v7
        with:
          name: templates-${{ matrix.target.name }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download templates
        uses: actions/download-artifact@v8
        with:
          pattern: templates-*
          path: release

      - name: Build manifest and template package
        shell: bash
        env:
          GODOT_TAG: ${{ needs.plan.outputs.godot_tag }}
          GODOT_COMMIT: ${{ needs.plan.outputs.godot_commit }}
          VERSION_STRING: ${{ needs.plan.outputs.version_string }}
          ENGINE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          profiles='{}'
          shopt -s nullglob
          profile_files=(profiles/*.build)
          if [ ${#profile_files[@]} -gt 0 ]; then
            profiles=$(for f in "${profile_files[@]}"; do
              printf '%s\t%s\n' "$(basename "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done | jq -Rn '[inputs | split("\t") | {(.[0]): .[1]}] | add // {}')
          fi

          targets='{}'
          while IFS= read -r meta; do
            dir=$(dirname "$meta")
            target=$(jq -r '.name' "$meta")
            args=$(jq -r '.args' "$meta")
            files=$(jq -r '.files[]' "$meta" | tr -d '\r' | while IFS= read -r f; do
              printf '%s\t%s\n' "$f" "$(sha256sum "$dir/$f" | cut -d' ' -f1)"
            done | jq -Rn '[inputs | split("\t") | {(.[0]): .[1]}] | add // {}')
            targets=$(jq -n \
              --argjson acc "$targets" \
              --arg name "$target" \
              --arg args "$args" \
              --argjson files "$files" \
              '$acc + {($name): {args: $args, files: $files}}')
          done < <(find release -name '*.target.json' -type f)

          jq -n \
            --arg godot_tag "$GODOT_TAG" \
            --arg godot_commit "$GODOT_COMMIT" \
            --arg version_string "$VERSION_STRING" \
            --arg engine_repo_commit "$ENGINE_COMMIT" \
            --argjson profiles "$profiles" \
            --argjson targets "$targets" \
            '{
              godot_tag: $godot_tag,
              godot_commit: $godot_commit,
              version_string: $version_string,
              engine_repo_commit: $engine_repo_commit,
              profiles: $profiles,
              targets: $targets
            }' > manifest.json

          mkdir -p tpz
          find release -type f ! -name '*.target.json' -exec cp {} tpz/ \;
          printf '%s\n' "$VERSION_STRING" > tpz/version.txt
          (cd tpz && zip -q -9 "../templates-${GODOT_TAG}.tpz" *)

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GODOT_TAG: ${{ needs.plan.outputs.godot_tag }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=7 HEAD)
          tag="${GODOT_TAG}-${short}"
          mapfile -t assets < <(find release -type f ! -name '*.target.json')
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "Export templates built from godot ${GODOT_TAG} at ${GITHUB_SHA}." \
            manifest.json "templates-${GODOT_TAG}.tpz" "${assets[@]}"
